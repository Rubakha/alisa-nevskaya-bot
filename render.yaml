services:
  - type: web
    name: alisa-bot
    runtime: python
    plan: starter          # диск доступен только на платных планах
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: python bot_best.py
    healthCheckPath: /health
    disk:
      name: alisa-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: BOT_USERNAME
        value: AlisaNevskaya_bot
      - key: PORT
        value: 5000
      - key: TG_BOT_TOKEN
        sync: false        # задать вручную в дашборде
      - key: ADMIN_ID
        sync: false
      - key: WEBHOOK_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false        # без ключа помощник просто выключен
